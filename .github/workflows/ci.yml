name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Host test suite
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      AE_TEST_RESOURCE_LIMITS_MODE: process
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang rebar3 git python3 build-essential libsqlite3-dev bubblewrap libseccomp2

      - name: Run host tests
        run: scripts/test
