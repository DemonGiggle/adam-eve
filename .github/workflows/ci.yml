name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Host test suite
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang rebar3 git python3 build-essential libsqlite3-dev

      - name: Run host tests
        run: scripts/test
